# ============================================================
# Project LUMI - Xcode 工程定义
#
# 这份 YAML 是 Xcode 工程的唯一事实来源，可在 Windows 上直接维护。
# macOS / CI 上执行 `xcodegen generate` 生成 LUMI.xcodeproj 后即可用
# xcodebuild 编译。绝不手工编辑 .xcodeproj。
#
# 安装 XcodeGen: brew install xcodegen
# ============================================================

name: LUMI
options:
  bundleIdPrefix: com.projectlumi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: "NO"

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.19.0"

targets:
  LUMI:
    type: application
    platform: iOS
    sources:
      - path: LUMI
        excludes:
          - "Info.plist"
    dependencies:
      - package: LiveKit
    settings:
      base:
        # 用工程里手写的 Info.plist 作为唯一事实来源。
        # 注意：绝不能再用 XcodeGen 的 info: 块——它会按默认值重写该文件，
        # 把 UILaunchScreen 之类的手工键抹掉，运行时就会退化成黑边兼容模式。
        INFOPLIST_FILE: LUMI/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.projectlumi.LUMI
        PRODUCT_NAME: LUMI
        MARKETING_VERSION: "2.1.2"
        CURRENT_PROJECT_VERSION: "23"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 本地开发/侧载：允许无团队签名编译
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_IDENTITY: "Apple Development"

  LUMITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LUMITests
    dependencies:
      - target: LUMI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectlumi.LUMITests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  LUMI:
    build:
      targets:
        LUMI: all
    test:
      gatherCoverageData: false
      targets:
        - LUMITests
    run:
      config: Debug
