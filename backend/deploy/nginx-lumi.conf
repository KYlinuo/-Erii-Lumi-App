# ============================================================
# Project LUMI - Nginx HTTPS 反向代理配置
#
# 用法：
#   1. 证书放到 /etc/letsencrypt/live/lumi.example.com/（certbot 签发）
#   2. cp nginx-lumi.conf /etc/nginx/sites-available/lumi
#      ln -s /etc/nginx/sites-available/lumi /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#   4. 后端只监听 127.0.0.1:8000，由 nginx 终结 TLS
# ============================================================

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name lumi.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lumi.example.com;

    ssl_certificate     /etc/letsencrypt/live/lumi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumi.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:LUMI:10m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 上传上限按聊天文本即可
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        # 模型调用可能较慢，读超时要大于 LUMI_PROVIDER_TIMEOUT_SECONDS
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
    }
}
