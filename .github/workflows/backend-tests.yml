# Project LUMI - 后端测试（Ubuntu）
name: Backend Tests

on:
  push:
    branches: [main, workbuddy-dev, "night/**"]
    paths: ["backend/**", "tests/**", "pytest.ini", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", "tests/**", "pytest.ini"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run tests
        env:
          LUMI_ENV: dev
        run: python -m pytest -v --tb=short

      - name: Environment self-check
        run: python scripts/check_env.py
